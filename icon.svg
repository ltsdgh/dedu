<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- tray -->
    <linearGradient id="trayOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFBF4"/>
      <stop offset="100%" stop-color="#E9E7DA"/>
    </linearGradient>
    <linearGradient id="trayInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAE8DB"/>
      <stop offset="100%" stop-color="#DEDCCD"/>
    </linearGradient>

    <!-- brand corner tiles (indigo) -->
    <linearGradient id="brandIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E86F2"/>
      <stop offset="100%" stop-color="#5A4FDC"/>
    </linearGradient>
    <!-- solved multiplier tiles (brighter emerald-mint) -->
    <linearGradient id="greenSolved" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8EFAE"/>
      <stop offset="100%" stop-color="#5CCB7E"/>
    </linearGradient>
    <!-- clue / number tiles (cream white) -->
    <linearGradient id="whiteTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFEFB"/>
      <stop offset="100%" stop-color="#EFEEE4"/>
    </linearGradient>
    <!-- centre product clue (given product — soft mint green) -->
    <linearGradient id="mintClue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7F3DE"/>
      <stop offset="100%" stop-color="#A2E2B6"/>
    </linearGradient>

    <!-- top gloss -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- glossy check -->
    <linearGradient id="checkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FCB7C"/>
      <stop offset="100%" stop-color="#1E9B50"/>
    </linearGradient>

    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#5b6b3a" flood-opacity="0.28"/>
    </filter>
    <filter id="trayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#9c9a86" flood-opacity="0.45"/>
    </filter>
    <filter id="checkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="2" stdDeviation="9" flood-color="#127a3c" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- transparent canvas; the tray is the icon body -->
  <!-- ══ Tray ══ -->
  <g filter="url(#trayShadow)">
    <rect x="40" y="40" width="944" height="944" rx="150" fill="url(#trayOuter)"/>
  </g>
  <rect x="72" y="72" width="880" height="880" rx="124" fill="url(#trayInner)"
        stroke="#cfcdba" stroke-width="2"/>
  <rect x="72" y="72" width="880" height="880" rx="124" fill="none"
        stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" transform="translate(0,2)"/>

  <!--
    3×3 grid. tiles 234px, gap 30, origin 130.
    cols/rows left: 130, 394, 658
    Concept:  corners = brand d-e-d-u (lime);
              4 & 3 = the deduced multipliers (emerald + ✓);
              6 & 2 = the alternative multiplier options (dashed clue);
              12 = the given product clue (plain, centre).
  -->

  <!-- ░░ helper geometry repeated per tile ░░ -->

  <!-- (0,0) d  lime -->
  <g filter="url(#tileShadow)"><rect x="130" y="130" width="234" height="234" rx="50" fill="url(#brandIndigo)"/></g>
  <rect x="146" y="146" width="202" height="96" rx="40" fill="url(#gloss)"/>
  <rect x="131" y="131" width="232" height="232" rx="49" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <text x="247" y="247" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-style="italic" font-size="138" fill="#FFFFFF" text-anchor="middle">d</text>

  <!-- (0,2) e  lime -->
  <g filter="url(#tileShadow)"><rect x="658" y="130" width="234" height="234" rx="50" fill="url(#brandIndigo)"/></g>
  <rect x="674" y="146" width="202" height="96" rx="40" fill="url(#gloss)"/>
  <rect x="659" y="131" width="232" height="232" rx="49" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <text x="775" y="247" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-style="italic" font-size="138" fill="#FFFFFF" text-anchor="middle">e</text>

  <!-- (2,0) d  lime -->
  <g filter="url(#tileShadow)"><rect x="130" y="658" width="234" height="234" rx="50" fill="url(#brandIndigo)"/></g>
  <rect x="146" y="674" width="202" height="96" rx="40" fill="url(#gloss)"/>
  <rect x="131" y="659" width="232" height="232" rx="49" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <text x="247" y="775" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-style="italic" font-size="138" fill="#FFFFFF" text-anchor="middle">d</text>

  <!-- (2,2) u  lime -->
  <g filter="url(#tileShadow)"><rect x="658" y="658" width="234" height="234" rx="50" fill="url(#brandIndigo)"/></g>
  <rect x="674" y="674" width="202" height="96" rx="40" fill="url(#gloss)"/>
  <rect x="659" y="659" width="232" height="232" rx="49" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <text x="775" y="775" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-style="italic" font-size="138" fill="#FFFFFF" text-anchor="middle">u</text>

  <!-- (0,1) 6  dashed alternative option -->
  <g filter="url(#tileShadow)"><rect x="394" y="130" width="234" height="234" rx="50" fill="url(#whiteTile)"/></g>
  <rect x="416" y="152" width="190" height="190" rx="34" fill="none" stroke="#16273F" stroke-width="6" stroke-dasharray="22 18" stroke-linecap="round"/>
  <text x="511" y="247" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="130" fill="#16273F" text-anchor="middle">6</text>

  <!-- (2,1) 2  dashed alternative option -->
  <g filter="url(#tileShadow)"><rect x="394" y="658" width="234" height="234" rx="50" fill="url(#whiteTile)"/></g>
  <rect x="416" y="680" width="190" height="190" rx="34" fill="none" stroke="#16273F" stroke-width="6" stroke-dasharray="22 18" stroke-linecap="round"/>
  <text x="511" y="775" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="130" fill="#16273F" text-anchor="middle">2</text>

  <!-- (1,0) 4  deduced multiplier  (dashed clue tile + ✓) -->
  <g filter="url(#tileShadow)"><rect x="130" y="394" width="234" height="234" rx="50" fill="url(#whiteTile)"/></g>
  <rect x="152" y="416" width="190" height="190" rx="34" fill="none" stroke="#16273F" stroke-width="6" stroke-dasharray="22 18" stroke-linecap="round"/>
  <text x="247" y="511" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="130" fill="#16273F" text-anchor="middle">4</text>

  <!-- (1,2) 3  deduced multiplier  (dashed clue tile + ✓) -->
  <g filter="url(#tileShadow)"><rect x="658" y="394" width="234" height="234" rx="50" fill="url(#whiteTile)"/></g>
  <rect x="680" y="416" width="190" height="190" rx="34" fill="none" stroke="#16273F" stroke-width="6" stroke-dasharray="22 18" stroke-linecap="round"/>
  <text x="775" y="511" dy="0.35em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="130" fill="#16273F" text-anchor="middle">3</text>

  <!-- (1,1) 12  given product clue  (solid soft mint, centre) -->
  <g filter="url(#tileShadow)"><rect x="394" y="394" width="234" height="234" rx="50" fill="url(#mintClue)" stroke="#74C593" stroke-width="2"/></g>
  <rect x="410" y="410" width="202" height="92" rx="40" fill="url(#gloss)"/>
  <text x="511" y="511" dy="0.36em" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="118" fill="#0f3d28" text-anchor="middle">12</text>

  <!-- ══ glossy check badges on the two deduced multipliers ══ -->
  <g filter="url(#checkGlow)">
    <circle cx="346" cy="404" r="44" fill="url(#checkGrad)" stroke="#ffffff" stroke-width="7"/>
  </g>
  <path d="M 326 404 l 13 15 l 23 -30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="338" cy="389" rx="20" ry="11" fill="#ffffff" fill-opacity="0.35"/>

  <g filter="url(#checkGlow)">
    <circle cx="676" cy="404" r="44" fill="url(#checkGrad)" stroke="#ffffff" stroke-width="7"/>
  </g>
  <path d="M 656 404 l 13 15 l 23 -30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="668" cy="389" rx="20" ry="11" fill="#ffffff" fill-opacity="0.35"/>
</svg>
