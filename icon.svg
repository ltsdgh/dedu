<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7B72FF"/>
      <stop offset="55%" stop-color="#5046E5"/>
      <stop offset="100%" stop-color="#3B31D4"/>
    </linearGradient>
    <linearGradient id="solvedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="cellShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8"
                    flood-color="#3B31D4" flood-opacity="0.20"/>
    </filter>
    <filter id="heroShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="12"
                    flood-color="#3B31D4" flood-opacity="0.28"/>
    </filter>
    <filter id="checkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10"
                    flood-color="#059669" flood-opacity="0.80"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#appBg)"/>

  <!--
    Layout: 2×2 outer grid
    Padding: 60px, Gap: 24px
    Cell: (1024 - 120 - 24) / 2 = 440px

    Col 0: x=60,  w=440   center=280
    Col 1: x=524, w=440   center=744
    Row 0: y=60,  h=440   center=280
    Row 1: y=524, h=440   center=744

    Mini sub-cells inside a cell (inner pad 20, gap 8):
    sub-cell w/h = (440-40-8)/2 = 196
    Col A: x=cell_x+20        Col B: x=cell_x+20+196+8=cell_x+224
    Row A: y=cell_y+20        Row B: y=cell_y+20+196+8=cell_y+224
  -->

  <!-- ══ TOP-LEFT: × symbol ══ -->
  <g stroke="#6ee7b7" stroke-width="44" stroke-linecap="round">
    <line x1="185" y1="185" x2="375" y2="375"/>
    <line x1="375" y1="185" x2="185" y2="375"/>
  </g>

  <!-- ══ TOP-RIGHT: mini 2×2 (2,3 / 4,6) — 4 is green ══
       cell origin x=524, y=60
       subA x=544, subB x=748, subA y=80, subB y=284
  -->
  <g filter="url(#cellShadow)">
    <rect x="524" y="60" width="440" height="440" rx="52"
          fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  </g>

  <!-- [0,0]=2 white -->
  <rect x="544" y="80" width="196" height="196" rx="24" fill="rgba(255,255,255,0.92)"/>
  <text x="642" y="178" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">2</text>

  <!-- [0,1]=3 white -->
  <rect x="748" y="80" width="196" height="196" rx="24" fill="rgba(255,255,255,0.92)"/>
  <text x="846" y="178" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">3</text>

  <!-- [1,0]=4 GREEN -->
  <rect x="544" y="284" width="196" height="196" rx="24" fill="url(#solvedGrad)" stroke="#059669" stroke-width="3"/>
  <text x="642" y="382" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">4</text>

  <!-- [1,1]=6 white -->
  <rect x="748" y="284" width="196" height="196" rx="24" fill="rgba(255,255,255,0.92)"/>
  <text x="846" y="382" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">6</text>

  <!-- ══ BOTTOM-LEFT: mini 2×2 (4,3 / 6,2) — 3 is green (top-right) ══
       cell origin x=60, y=524
       subA x=80, subB x=284, subA y=544, subB y=748
  -->
  <g filter="url(#cellShadow)">
    <rect x="60" y="524" width="440" height="440" rx="52"
          fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  </g>

  <!-- [0,0]=6 white (top-left) -->
  <rect x="80" y="544" width="196" height="196" rx="24" fill="rgba(255,255,255,0.92)"/>
  <text x="178" y="642" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">6</text>

  <!-- [0,1]=3 GREEN (top-right) -->
  <rect x="284" y="544" width="196" height="196" rx="24" fill="url(#solvedGrad)" stroke="#059669" stroke-width="3"/>
  <text x="382" y="642" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">3</text>

  <!-- [1,0]=4 white (bottom-left) -->
  <rect x="80" y="748" width="196" height="196" rx="24" fill="rgba(255,255,255,0.92)"/>
  <text x="178" y="846" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">4</text>

  <!-- [1,1]=2 white (bottom-right) -->
  <rect x="284" y="748" width="196" height="196" rx="24" fill="rgba(255,255,255,0.92)"/>
  <text x="382" y="846" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="110" fill="#000000" text-anchor="middle">2</text>

  <!-- ══ BOTTOM-RIGHT: 12 ══ -->
  <g filter="url(#heroShadow)">
    <rect x="524" y="524" width="440" height="440" rx="52"
          fill="url(#solvedGrad)" stroke="#059669" stroke-width="4"/>
  </g>
  <text x="744" y="744" dy="0.38em"
        font-family="'Arial Black',Arial,sans-serif"
        font-weight="900" font-size="250"
        fill="#000000" text-anchor="middle">12</text>


</svg>
