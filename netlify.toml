# Deployed automatically from GitHub on every push to master.
# Only the website files are copied to dist/, so repo-only files
# (ios/, store-listings.md, scripts, configs) are never published.
[build]
  command = "rm -rf dist && mkdir dist && cp index.html privacy.html sw.js manifest.json *.png *.jpeg *.svg dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
